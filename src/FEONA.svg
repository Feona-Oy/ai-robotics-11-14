<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" width="100%" height="100%">
  <style>
    .bg { fill: #15171A; }
    .text-main { font-family: 'Archivo', sans-serif; font-variation-settings: 'wdth' 118, 'wght' 600; font-size: 38px; fill: #E9EAE6; letter-spacing: -0.01em; }
    .text-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; fill: #9AA0A6; letter-spacing: 0.2em; text-transform: uppercase; }
    .mark-ring { fill: none; stroke: #343840; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .mark-core { fill: rgba(126, 147, 234, 0.2); stroke: #7E93EA; stroke-width: 1.5; }
    .mark-node { fill: #7E93EA; }
  </style>
  <rect width="100%" height="100%" rx="4" class="bg" />
  
  <g transform="translate(74, 70)">
    <circle cx="0" cy="0" r="42" class="mark-ring"/>
    <circle cx="0" cy="0" r="18" class="mark-core"/>
    <circle cx="0" cy="-28" r="4.5" class="mark-node"/>
    <circle cx="26" cy="14" r="4.5" class="mark-node"/>
    <circle cx="-26" cy="14" r="4.5" class="mark-node"/>
    <line x1="0" y1="-18" x2="0" y2="-28" stroke="#7E93EA" stroke-width="1.5"/>
    <line x1="9" y1="10" x2="26" y2="14" stroke="#7E93EA" stroke-width="1.5"/>
    <line x1="-9" y1="10" x2="-26" y2="14" stroke="#7E93EA" stroke-width="1.5"/>
  </g>
  
  <text x="148" y="78" class="text-main">FEONA</text>
  <text x="150" y="101" class="text-sub">Education &amp; STEM Lab</text>
</svg>
